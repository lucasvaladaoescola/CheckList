<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Checklist Compartilhável</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <h1>Checklist Compartilhável</h1>

        <div class="add-area">
            <input type="text" id="itemText" placeholder="Novo item...">
            <button onclick="addItem()">Adicionar</button>
        </div>

        <ul id="lista"></ul>

        <div class="footer">
            <p id="percentual">Concluído: 0%</p>
            <button onclick="shareList()">Compartilhar Lista</button>
        </div>
    </div>

<script>
let items = [];

function loadFromURL() {
    const params = new URLSearchParams(window.location.search);
    if (params.has("data")) {
        try {
            items = JSON.parse(decodeURIComponent(params.get("data")));
            render();
        } catch (e) {
            console.error("Erro ao carregar dados da URL");
        }
    }
}

function saveToURL() {
    const data = encodeURIComponent(JSON.stringify(items));
    history.replaceState(null, "", "?data=" + data);
}

function addItem() {
    const text = document.getElementById("itemText").value.trim();
    if (text === "") return;

    items.push({ text, done: false });
    document.getElementById("itemText").value = "";
    render();
    saveToURL();
}

function toggleItem(index) {
    items[index].done = !items[index].done;
    render();
    saveToURL();
}

function deleteItem(index) {
    items.splice(index, 1);
    render();
    saveToURL();
}

function render() {
    const lista = document.getElementById("lista");
    lista.innerHTML = "";

    items.forEach((item, index) => {
        lista.innerHTML += `
            <li>
                <input type="checkbox" ${item.done ? "checked" : ""} onclick="toggleItem(${index})">
                <span class="${item.done ? 'done' : ''}">${item.text}</span>
                <button onclick="deleteItem(${index})">X</button>
            </li>`;
    });

    updatePercent();
}

function updatePercent() {
    const total = items.length;
    const done = items.filter(i => i.done).length;
    const percent = total === 0 ? 0 : Math.round((done / total) * 100);
    document.getElementById("percentual").innerText = `Concluído: ${percent}%`;
}

function shareList() {
    saveToURL();
    navigator.clipboard.writeText(window.location.href);
    alert("Link copiado! Envie para quem você quiser.");
}

loadFromURL();
</script>

</body>
</html>
